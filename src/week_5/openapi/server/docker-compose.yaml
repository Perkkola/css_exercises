
services:
  db:
    image: postgres:17
    container_name: postgres17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myappdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - appnet

  server:
    build: .
    container_name: course-service
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    depends_on:
      - db
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
