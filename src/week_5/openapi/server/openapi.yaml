openapi: 3.0.0
info:
  title: Course Management System
  version: 1.0.0
servers:
  - url: "http://127.0.0.1:3000/api"
    description: course REST API

paths:
  /health:
    get:
      summary: health
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  
components:
  schemas:
    Course:
      description: course schema
    Courses:
      description: list of courses
    Professor:
      description: professor schema
    Professors:
      description: list of professors
    Success:
      description: success schema
    Error:
      description: error schema
          
          
          
          
          
          