syntax = "proto3";

// The restaurant service definition.
service OrderService {
  // Sends an order request
  rpc FoodOrder (OrderRequest) returns (OrderResponse) {}
  rpc DrinkOrder (OrderRequest) returns (OrderResponse) {}
  rpc DessertOrder (OrderRequest) returns (OrderResponse) {}
  rpc MealOrder (OrderRequest) returns (OrderResponse) {}
}

// The request message containing the orderID and a list of order items
message OrderRequest {
  string orderID = 1;
  repeated string items = 2;
  float distance = 3;
}

// The response message containing the order ID and a status
message OrderResponse {
  string orderID = 1;
  enum Status {
    ACCEPTED = 0;
    REJECTED = 1;
  }
  Status status = 2;
  repeated items itemMessage = 3;
  string message = 4;
  string trackingCode = 5;
  string deliveryServerPort = 6;
}

// nested message used in response message 
message items{
  string itemName = 1;
}